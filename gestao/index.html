    <button type="button" id="toggle-sidebar" class="icon-btn toggle-sidebar" title="Recolher ou expandir o menu" aria-label="Recolher ou expandir menu" aria-controls="sidebar" aria-expanded="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
    </button>
    <a class="brand" href="./" aria-label="Maringá Alerta · Início"><span class="brand-mark">M<span class="brand-dot">•</span></span><span class="brand-text"><strong>MARINGÁ ALERTA</strong><small>Gestão municipal</small></span></a>
  </div>
  <a id="abrir-mapa" class="map-launch" href="../index.html" target="_blank" rel="noopener noreferrer" title="Abrir o Mapa Operacional em janela independente" aria-label="Abrir Mapa Operacional em nova janela">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg>
    <span>Mapa Operacional</span>
    <svg class="map-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M14 5h5v5M19 5l-9 9"/><path d="M19 13v6H5V5h6"/></svg>
  </a>
  <div class="topbar-right"><div id="session-anchor" class="session-anchor"></div></div>
</header>
<div class="app-frame" id="app-frame">
  <aside class="sidebar" id="sidebar" aria-label="Cadastros do sistema">
    <div class="municipio-box">
      <label for="municipio-switch">PREFEITURA ATIVA</label>
      <div class="select-wrap"><select id="municipio-switch" aria-label="Selecionar prefeitura"></select><span class="select-caret" aria-hidden="true">⌄</span></div>
    </div>
    <nav id="sidebar-nav" class="sidebar-nav" aria-label="Navegação de cadastros"></nav>
    <div class="sidebar-foot"><span class="foot-mark">M</span><span class="foot-copy">Maringá Alerta</span></div>
  </aside>
  <div class="sidebar-scrim" id="sidebar-scrim"></div>
  <main id="main" class="content" tabindex="-1"><div class="page" id="page"></div></main>
</div>
<div class="drawer-overlay" id="drawer-overlay" hidden>
  <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">

    <div class="drawer-scroll">
      <form id="cadastro-form">
        <div id="cadastro-campos" class="form-grid"></div>
        <div class="form-error" id="form-error" role="alert" aria-live="polite"></div>
        <div class="drawer-actions"><button type="button" class="btn btn-quiet" id="drawer-cancel">Cancelar</button><button type="submit" class="btn btn-primary" id="drawer-save">Salvar cadastro</button></div>
      </form>
    </div>
  </section>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
