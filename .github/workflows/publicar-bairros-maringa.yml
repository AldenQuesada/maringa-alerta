name: Publicar bairros oficiais de Maringá

on:
  push:
    branches:
      - feat/bairros-oficiais-nos-tres-mapas-20261104
    paths:
      - scripts/atualizar-bairros-maringa.py
      - scripts/atualizar-camadas-municipais.py
      - scripts/atualizar-bairros-ibge2022.py
      - .github/workflows/publicar-bairros-maringa.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar leitor de shapefile IBGE
        run: python -m pip install pyshp==2.3.1
      - name: Consultar fonte geográfica oficial
        run: python scripts/atualizar-bairros-maringa.py
      - name: Extrair bairros do IBGE 2022
        run: python scripts/atualizar-bairros-ibge2022.py
      - name: Consultar bairro e zonas GeoMaringá
        run: python scripts/atualizar-camadas-municipais.py
      - name: Validar arquivo gerado
        run: |
          python - <<'PY'
          import json
          with open('dados-territoriais/maringa-bairros.geojson') as f:
              data=json.load(f)
          assert data['type']=='FeatureCollection'
          assert len(data['features'])>=30
          print("Bairros validados:",len(data['features']))
          PY
      - name: Versionar GeoJSON no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados-territoriais/maringa-*.geojson dados-territoriais/maringa-*-fonte.json
          if git diff --cached --quiet; then
            echo "Arquivo sem diferenças."
          else
            git commit -m "Atualizar geometrias de bairros IBGE/Paraná e diagnóstico GeoMaringá"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
