name: Testes do protótipo

on:
  workflow_call:
  push:
    branches:
      - main
      - feat/sistema-integrado-crise-tres-mapas-20261104
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências de teste
        run: npm ci
      - name: Verificar montagem canônica dos módulos
        run: node scripts/build-modulos.mjs --check
      - name: Verificar sintaxe dos módulos
        run: |
          node --check evento/app.js
          node --check cadastro-ocorrencia.js
          node --check fluxo-ajuda.js
          node --check gestao/dados.js
          node --check gestao/gestao.js
          node --check gestao/central-conversas.js
          node --check crise/core.js
          node --check mapas/app.js
          node --check atendimento/chat.js
          node --check dados-territoriais/camadas-mapas.js
          node --check gestao/catalogo-bairros.js
          node --check plataforma/modelo.js
          node --check plataforma/app.js
          node --check backend/boot.js
          node --check backend/repositorio.js
      - name: Executar testes funcionais
        run: node --test tests/*.test.cjs gestao/tests/*.test.cjs crise/tests/*.test.cjs plataforma/tests/*.test.cjs tests/backend/*.test.cjs
  # Nome estável: exigido na proteção da main e no workflow de publicação.
  mapas-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Instalar navegadores isolados
        run: npx playwright install --with-deps chromium webkit
      - name: Conferir fontes e bundles
        run: npm run check
      - name: Câmeras canônicas, celular e pinça nos três mapas
        run: npm run test:mapas:mobile
      - name: Mapa Monitoramento animal no celular
        run: npm run test:monitoramento-animal
      - name: Guardar relatório, capturas e rastros dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapas-mobile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .test-results/mapas
            .playwright-report/mapas
            .test-results/monitoramento-animal
            .playwright-report/monitoramento-animal
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  permissoes-banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
        env:
          POSTGRES_PASSWORD: teste-local-descartavel
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: teste-local-descartavel
      PGDATABASE: teste_pra_somar
    steps:
      - uses: actions/checkout@v4
      - name: Validar migrações e isolamento no banco descartável
        run: |
          # template0 mantém o PostGIS fora de public; a migração instala em gis.
          createdb -h localhost -U postgres --template=template0 teste_pra_somar
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/bootstrap-local.sql
          for migration in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "revoke usage on schema auth from ma_escritor;"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/permissoes.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/seguranca-servidor.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/operacoes.sql
          MARINGA_TESTE_DESCARTAVEL=1 PGHOST=localhost PGPORT=5432 PGUSER=postgres PGDATABASE=teste_pra_somar python3 tests/backend/concorrencia.py
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/painel.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/admin-geral.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/integracao.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/incidentes.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/colaboradores.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/e1-cadastros.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/e3-consultas.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/autoridade.sql
          MARINGA_TESTE_DESCARTAVEL=1 PGHOST=localhost PGPORT=5432 PGUSER=postgres python3 tests/backend/colaboradores-concorrencia.py
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/territorio.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/monitoramento-animal.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/protecao-animal-acoes.sql
          MARINGA_TESTE_DESCARTAVEL=1 PGHOST=localhost PGPORT=5432 PGUSER=postgres python3 tests/backend/territorio-concorrencia.py
          MARINGA_TESTE_DESCARTAVEL=1 PGHOST=localhost PGPORT=5432 PGUSER=postgres python3 tests/backend/territorio-espacial.py

      - name: Testar fluxos e cópia canônica do WhatsApp
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/whatsapp/fluxos.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/whatsapp/catalogo.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/whatsapp/canonico.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/whatsapp/animal.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/whatsapp/alertas.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/whatsapp/contatos.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/whatsapp/exclusao-definitiva.sql
          MARINGA_TESTE_DESCARTAVEL=1 PGHOST=localhost PGPORT=5432 PGUSER=postgres PGDATABASE=teste_pra_somar python3 tests/whatsapp/exclusao-concorrente.py
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/whatsapp/fotos-historicas.sql
          MARINGA_TESTE_DESCARTAVEL=1 PGHOST=localhost PGPORT=5432 PGUSER=postgres PGDATABASE=teste_pra_somar python3 tests/whatsapp/comparar-copia.py
  transporte-whatsapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14
      - run: deno test --allow-env tests/whatsapp/edge.test.ts

  autoridade-banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: teste-local-descartavel
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U supabase_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: teste-local-descartavel
      PGHOST: localhost
      PGDATABASE: teste_autoridade
      MARINGA_TESTE_DESCARTAVEL: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Migrações candidatas sem superuser e matriz efetiva de privilégios
        run: scripts/testar-autoridade-banco.sh
      - name: Guards de cadastro e território no executor hospedado
        run: |
          psql -X -U postgres -v ON_ERROR_STOP=1 -f tests/backend/e1-cadastros.sql
          psql -X -U postgres -v ON_ERROR_STOP=1 -f tests/backend/colaboradores.sql
          psql -X -U postgres -v ON_ERROR_STOP=1 -f tests/backend/territorio.sql

  primeiro-acesso:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Instalar ambiente vazio com autenticação real
        run: tests/acesso/iniciar.sh
      - name: Cadastro administrativo, envio e senha em Chromium e WebKit
        run: docker exec pra-somar-fase2-web npx playwright test --config=tests/acesso/playwright.config.cjs
      - name: Recolher evidências sem credenciais
        if: always()
        run: |
          mkdir -p .test-results/acesso
          docker cp pra-somar-fase2-web:/app/.test-results/acesso/. .test-results/acesso/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primeiro-acesso-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-results/acesso
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  liberacao:
    if: always()
    needs: [verificar, permissoes-banco, autoridade-banco, transporte-whatsapp, mapas-mobile, primeiro-acesso]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exigir sucesso de todas as verificações críticas
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/verificar-liberacao.mjs jobs
