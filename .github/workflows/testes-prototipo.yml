name: Testes do protótipo

on:
  workflow_call:
  push:
    branches:
      - main
      - feat/sistema-integrado-crise-tres-mapas-20261104
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências de teste
        run: npm ci
      - name: Verificar montagem canônica dos módulos
        run: node scripts/build-modulos.mjs --check
      - name: Verificar sintaxe dos módulos
        run: |
          node --check evento/app.js
          node --check cadastro-ocorrencia.js
          node --check fluxo-ajuda.js
          node --check gestao/dados.js
          node --check gestao/gestao.js
          node --check gestao/central-conversas.js
          node --check crise/core.js
          node --check mapas/app.js
          node --check atendimento/chat.js
          node --check dados-territoriais/camadas-mapas.js
          node --check gestao/catalogo-bairros.js
          node --check plataforma/modelo.js
          node --check plataforma/app.js
          node --check backend/boot.js
          node --check backend/repositorio.js
      - name: Executar testes funcionais
        run: node --test tests/*.test.cjs gestao/tests/*.test.cjs crise/tests/*.test.cjs plataforma/tests/*.test.cjs tests/backend/*.test.cjs
  # Nome estável: exigido na proteção da main e no workflow de publicação.
  mapas-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Instalar navegadores isolados
        run: npx playwright install --with-deps chromium webkit
      - name: Conferir fontes e bundles
        run: npm run check
      - name: Câmeras canônicas, celular e pinça nos três mapas
        run: npm run test:mapas:mobile
      - name: Guardar relatório, capturas e rastros dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapas-mobile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .test-results/mapas
            .playwright-report/mapas
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  permissoes-banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste-local-descartavel
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: teste-local-descartavel
    steps:
      - uses: actions/checkout@v4
      - name: Validar migrações e isolamento no banco descartável
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/bootstrap-local.sql
          for migration in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "revoke usage on schema auth from ma_escritor;"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/permissoes.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/seguranca-servidor.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/operacoes.sql
          MARINGA_TESTE_DESCARTAVEL=1 PGHOST=localhost PGPORT=5432 PGUSER=postgres PGDATABASE=postgres python3 tests/backend/concorrencia.py
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/painel.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/admin-geral.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/integracao.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/backend/incidentes.sql

      - name: Testar fluxos e cópia canônica do WhatsApp
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/whatsapp/fluxos.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/whatsapp/catalogo.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/whatsapp/canonico.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/whatsapp/contatos.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/whatsapp/exclusao-definitiva.sql
          MARINGA_TESTE_DESCARTAVEL=1 PGHOST=localhost PGPORT=5432 PGUSER=postgres PGDATABASE=postgres python3 tests/whatsapp/exclusao-concorrente.py
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/whatsapp/fotos-historicas.sql
          MARINGA_TESTE_DESCARTAVEL=1 PGHOST=localhost PGPORT=5432 PGUSER=postgres PGDATABASE=postgres python3 tests/whatsapp/comparar-copia.py
  transporte-whatsapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14
      - run: deno test --allow-env tests/whatsapp/edge.test.ts
